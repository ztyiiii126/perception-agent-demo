<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=task-list.html" />
    <title>知识库 - 感知Agent</title>
    <style>
      :root {
        --panel-soft: #f3f6fa;
        --text: #20242a;
        --muted: #737d8c;
        --line: #dde5ec;
        --accent: #171717;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 62% 0%, rgba(255, 255, 255, 0.94) 0 18%, transparent 42%),
          linear-gradient(135deg, #f3f6fa 0%, #fbfcfd 50%, #edf7f3 100%);
        color: var(--text);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 282px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 22px 16px;
        border-right: 1px solid rgba(223, 216, 203, 0.78);
        background: rgba(244, 247, 249, 0.86);
        backdrop-filter: blur(18px);
      }

      .brand {
        padding: 6px 10px 10px;
        font-size: 22px;
        font-weight: 840;
        line-height: 1.15;
      }

      .new-task {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 650;
        box-shadow: 0 12px 26px rgba(23, 23, 23, 0.18);
      }

      .task-stack {
        display: grid;
        gap: 8px;
      }

      .tasks {
        display: flex;
        min-height: 0;
        margin-top: 14px;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }

      .section-title {
        display: block;
        padding: 0 10px;
        color: #9a9285;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .task-item {
        display: flex;
        min-height: 42px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }

      .task-name {
        overflow: hidden;
        color: #38342e;
        font-size: 14px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-dialog {
        width: min(960px, calc(100vw - 48px));
        padding: 0;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 20px;
        background: #fff;
        color: var(--text);
        box-shadow: 0 28px 80px rgba(32, 44, 62, 0.18);
      }

      .task-dialog::backdrop {
        background: rgba(32, 40, 52, 0.24);
        backdrop-filter: blur(8px);
      }

      .dialog-head,
      .dialog-body,
      .dialog-actions {
        padding: 18px 20px;
      }

      .dialog-head {
        border-bottom: 1px solid var(--line);
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--line);
      }

      .dialog-title {
        font-size: 18px;
        font-weight: 800;
      }

      .dialog-body textarea {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        outline: 0;
        background: #fbfcfd;
        color: var(--text);
        line-height: 1.7;
      }

      .dialog-actions button {
        height: 36px;
        padding: 0 14px;
        border-radius: 11px;
        cursor: pointer;
        font-weight: 760;
      }

      .dialog-cancel {
        border: 1px solid var(--line);
        background: #fff;
        color: #59636e;
      }

      .dialog-submit {
        border: 1px solid rgba(23, 23, 23, 0.18);
        background: var(--accent);
        color: #fff;
      }

      .primary-menu,
      .nav-stack {
        display: grid;
        gap: 8px;
      }

      .primary-menu-button {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #4c5563;
        cursor: pointer;
        font-weight: 760;
        font-size: 14px;
        text-align: left;
      }

      .primary-menu-button.active {
        background: rgba(255, 255, 255, 0.72);
        color: #20242a;
      }

      .primary-icon {
        display: block;
        flex: 0 0 18px;
        width: 18px;
        height: 18px;
        margin: 0;
      }

      .primary-label {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        line-height: 1;
      }

      .agent-nav {
        margin-left: 12px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }

      .nav-button {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        width: 100%;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 650;
        text-align: left;
      }

      .nav-icon {
        display: grid;
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 9px;
        background: var(--panel-soft);
        color: #504b44;
      }



      .agent-nav .nav-button {
        min-height: 36px;
        padding: 0 10px;
        color: #6a7482;
        font-size: 13px;
        font-weight: 620;
      }

      .agent-nav .nav-icon {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: transparent;
        color: #6f7784;
      }

      .agent-nav .nav-button.active {
        background: rgba(255, 255, 255, 0.56);
        color: #303844;
      }

      .agent-nav .nav-button.active .nav-icon {
        background: transparent;
        color: var(--accent);
      }


      .app {
        transition: grid-template-columns 180ms ease;
      }

      .app.sidebar-collapsed {
        grid-template-columns: 78px minmax(0, 1fr);
      }

      .sidebar {
        overflow: hidden;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .app.sidebar-collapsed .sidebar {
        gap: 16px;
        padding: 20px 12px;
      }

      .app.sidebar-collapsed .brand {
        justify-content: center;
        padding: 4px 0 8px;
      }

      .app.sidebar-collapsed .brand span,
      .app.sidebar-collapsed .new-task span,
      .app.sidebar-collapsed .primary-label,
      .app.sidebar-collapsed .nav-label,
      .app.sidebar-collapsed .task-name,
      .app.sidebar-collapsed .section-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        transform: translateX(-6px);
        pointer-events: none;
      }

      .app.sidebar-collapsed .new-task,
      .app.sidebar-collapsed .primary-menu-button,
      .app.sidebar-collapsed .nav-button,
      .app.sidebar-collapsed .task-item {
        justify-content: center;
        width: 46px;
        padding: 0;
      }

      .app.sidebar-collapsed .primary-menu-button {
        gap: 0;
      }

      .app.sidebar-collapsed .agent-nav {
        margin-left: 0;
        padding-left: 0;
        border-left: 0;
      }

      .app.sidebar-collapsed .tasks {
        display: none;
      }

      main {
        min-width: 0;
        padding: 38px 44px 34px;
      }

      .workspace {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      .topbar {
        width: min(100%, 1120px);
        margin: 0 auto 28px;
        color: var(--muted);
        font-size: 14px;
      }

      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(22px, 2.1vw, 28px);
        line-height: 1.15;
      }

      .page-desc {
        margin-top: 10px;
        max-width: 760px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .import-wrap {
        position: relative;
        display: inline-flex;
      }

      .create-knowledge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 38px;
        padding: 0 15px;
        border: 1px solid rgba(23, 23, 23, 0.18);
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 760;
        white-space: nowrap;
        box-shadow: 0 12px 26px rgba(23, 23, 23, 0.18);
      }

      .import-menu {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        z-index: 2;
        display: none;
        width: 220px;
        padding: 8px;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 42px rgba(32, 44, 62, 0.14);
      }

      .import-wrap:hover .import-menu,
      .import-wrap:focus-within .import-menu {
        display: grid;
        gap: 6px;
      }

      .import-option {
        min-height: 40px;
        padding: 0 11px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #303844;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        text-align: left;
      }

      .import-option:hover {
        background: var(--panel-soft);
      }

      .search-row {
        margin-bottom: 16px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 14px;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 10px 26px rgba(32, 44, 62, 0.06);
      }

      .search-box svg {
        flex: 0 0 auto;
        width: 17px;
        height: 17px;
        color: #8c96a4;
      }

      .search-box input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: #303844;
        font-size: 14px;
      }

      .search-box input::placeholder {
        color: #9aa4b2;
      }

      .document-panel {
        overflow: hidden;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 22px 60px rgba(32, 44, 62, 0.11);
      }

      .document-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .document-title {
        font-size: 16px;
        font-weight: 820;
      }

      .document-subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .document-list {
        display: grid;
      }

      .document-row {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 82px;
        padding: 15px 20px;
        border-top: 1px solid var(--line);
        text-decoration: none;
        transition:
          background 160ms ease,
          border-color 160ms ease;
      }

      .document-row:hover {
        background: #f8fafc;
      }

      .document-row:first-child {
        border-top: 0;
      }

      .doc-icon {
        display: grid;
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid #d8e1ea;
        border-radius: 12px;
        background: #f7fafc;
        color: var(--accent);
      }

      .doc-icon-inner {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
      }

      .doc-main {
        min-width: 0;
        flex: 1;
        color: inherit;
        text-decoration: none;
      }

      .doc-main:hover {
        text-decoration: none;
      }

      .doc-name {
        overflow: hidden;
        color: #20242a;
        font-size: 16px;
        font-weight: 760;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .document-row:hover .doc-name {
        color: #20242a;
      }

      .doc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 7px;
        color: var(--muted);
        font-size: 13px;
      }

      .doc-separator {
        color: #b8a995;
      }

      .doc-actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 18px;
      }

      .doc-ready {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
      }

      .doc-more {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #6f7784;
        cursor: pointer;
        font-size: 20px;
        letter-spacing: 1px;
      }

      .doc-more:hover {
        background: var(--panel-soft);
      }

      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      /* __SIDEBAR_OVERRIDE_START__ */

      /* Unified sidebar lock: keep the left navigation identical on every page. */
      .app {
        display: grid !important;
        grid-template-columns: 282px minmax(0, 1fr) !important;
        min-height: 100vh !important;
      }

        position: sticky !important;

      }

      .primary-menu,
      .nav-stack,
      .task-stack {
        display: grid !important;

      }

  <body>
    <div class="app" id="appShell">
      <aside class="sidebar" aria-label="左侧导航">
        <div class="brand">
          <span>感知Agent</span>
        </div>
        <button class="new-task" type="button" onclick="location.href='new-task.html'">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          新建任务
        </button>
        <nav class="primary-menu" aria-label="功能导航">
          <button class="primary-menu-button" type="button" onclick="location.href='agent-management.html'"><svg class="primary-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z" /><path d="M9 12h6" /><path d="M12 9v6" /></svg><span class="primary-label">Agent</span></button>
          <div class="nav-stack agent-nav" aria-label="Agent功能">
            <button class="nav-button" type="button" onclick="location.href='index.html'">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 2 2 4-5" /><path d="M20 12a8 8 0 1 1-3.1-6.3" /><path d="M18 4h3v3" /></svg>
              </span>
              巡检捉虫
            </button>
            <button class="nav-button" type="button" onclick="location.href='opinion.html'">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4" /></svg>
              </span>
              舆情分析
            </button>
          </div>
