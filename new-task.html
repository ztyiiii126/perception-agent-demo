<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新建任务 - 感知Agent</title>
    <style>
      :root {
        --panel-soft: #f3f6fa;
        --text: #20242a;
        --muted: #737d8c;
        --line: #dde5ec;
        --accent: #171717;
        --shadow: 0 22px 60px rgba(32, 44, 62, 0.11);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 62% 0%, rgba(255, 255, 255, 0.94) 0 18%, transparent 42%),
          linear-gradient(135deg, #f3f6fa 0%, #fbfcfd 50%, #edf7f3 100%);
        color: var(--text);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 282px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 22px 16px;
        border-right: 1px solid rgba(223, 216, 203, 0.78);
        background: rgba(244, 247, 249, 0.86);
        backdrop-filter: blur(18px);
      }

      .brand {
        padding: 6px 10px 10px;
        font-size: 22px;
        font-weight: 840;
        line-height: 1.15;
      }

      .new-task {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 650;
        box-shadow: 0 12px 26px rgba(23, 23, 23, 0.18);
      }

      .primary-menu,
      .nav-stack,
      .task-stack {
        display: grid;
        gap: 8px;
      }

      .primary-menu-button {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #4c5563;
        cursor: pointer;
        font-weight: 760;
        font-size: 14px;
        text-align: left;
      }

      .primary-icon {
        display: block;
        flex: 0 0 18px;
        width: 18px;
        height: 18px;
        margin: 0;
      }

      .primary-label {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        line-height: 1;
      }

      .agent-nav {
        margin-left: 12px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }

      .nav-button,
      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
        text-decoration: none;
      }

      .nav-button {
        padding: 0 12px;
        font-weight: 650;
      }

      .nav-icon {
        display: grid;
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 9px;
        background: var(--panel-soft);
        color: #504b44;
      }

      .tasks {
        display: flex;
        min-height: 0;
        margin-top: 14px;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }

      .section-title {
        display: block;
        padding: 0 10px;
        color: #9a9285;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .task-item {
        padding: 10px;
      }

      .task-name {
        overflow: hidden;
        color: #38342e;
        font-size: 14px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }



      .agent-nav .nav-button {
        min-height: 36px;
        padding: 0 10px;
        color: #6a7482;
        font-size: 13px;
        font-weight: 620;
      }

      .agent-nav .nav-icon {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: transparent;
        color: #6f7784;
      }

      .agent-nav .nav-button.active {
        background: rgba(255, 255, 255, 0.56);
        color: #303844;
      }

      .agent-nav .nav-button.active .nav-icon {
        background: transparent;
        color: var(--accent);
      }


      .app {
        transition: grid-template-columns 180ms ease;
      }

      .app.sidebar-collapsed {
        grid-template-columns: 78px minmax(0, 1fr);
      }

      .sidebar {
        overflow: hidden;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .app.sidebar-collapsed .sidebar {
        gap: 16px;
        padding: 20px 12px;
      }

      .app.sidebar-collapsed .brand {
        justify-content: center;
        padding: 4px 0 8px;
      }

      .app.sidebar-collapsed .brand span,
      .app.sidebar-collapsed .new-task span,
      .app.sidebar-collapsed .primary-label,
      .app.sidebar-collapsed .nav-label,
      .app.sidebar-collapsed .task-name,
      .app.sidebar-collapsed .section-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        transform: translateX(-6px);
        pointer-events: none;
      }

      .app.sidebar-collapsed .new-task,
      .app.sidebar-collapsed .primary-menu-button,
      .app.sidebar-collapsed .nav-button,
      .app.sidebar-collapsed .task-item {
        justify-content: center;
        width: 46px;
        padding: 0;
      }

      .app.sidebar-collapsed .primary-menu-button {
        gap: 0;
      }

      .app.sidebar-collapsed .agent-nav {
        margin-left: 0;
        padding-left: 0;
        border-left: 0;
      }

      .app.sidebar-collapsed .tasks {
        display: none;
      }

      main {
        min-width: 0;
        padding: 38px 44px 34px;
      }

      .topbar,
      .workspace {
        width: min(100%, 930px);
        margin: 0 auto;
      }

      .topbar {
        margin-bottom: 54px;
        color: var(--muted);
        font-size: 14px;
      }

      h1 {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(22px, 2.1vw, 28px);
        font-weight: 760;
        line-height: 1.15;
      }

      .chat-panel {
        overflow: visible;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow);
      }

      .prompt-area {
        display: flex;
        min-height: 282px;
        flex-direction: column;
        justify-content: space-between;
        padding: 26px 28px 18px;
      }

      .prompt-input {
        width: 100%;
        min-height: 162px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: #3f4650;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.85;
      }

      .prompt-input::placeholder {
        color: #9aa4b2;
      }

      .prompt-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 18px;
        margin-top: 28px;
      }

      .config-tools {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .expand-menu {
        position: relative;
      }

      .expand-menu summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 4px 0 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #f7f9fb;
        color: #47505d;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        list-style: none;
      }

      .expand-menu summary::-webkit-details-marker {
        display: none;
      }

      .expand-count,
      .config-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        min-width: 38px;
        padding: 0 9px;
        border-radius: 9px;
        background: #e9edf3;
        color: #303844;
        font-size: 14px;
        font-weight: 760;
      }

      .expand-panel {
        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        z-index: 3;
        overflow: hidden;
        width: 280px;
        padding: 0;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 42px rgba(32, 44, 62, 0.16);
      }

      .config-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 58px;
        padding: 0 14px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: #20242a;
        cursor: pointer;
        font-size: 16px;
        font-weight: 760;
        text-align: left;
      }

      .config-row:hover {
        background: #f7f9fb;
      }

      .config-icon {
        display: grid;
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        place-items: center;
        color: #303844;
      }

      .config-label {
        flex: 1;
      }

      .config-count {
        min-width: 34px;
        height: 28px;
        border-radius: 999px;
        color: #59636e;
        font-size: 13px;
      }

      .config-arrow {
        color: #20242a;
      }

      .config-summary {
        padding: 15px 16px;
        background: #fbfcfd;
        color: #5f6876;
        font-size: 14px;
        font-weight: 650;
      }

      .run-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .run-button:hover {
        background: var(--accent);
        transform: translateY(-1px);
      }

      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .run-button svg {
        width: 22px;
        height: 22px;
      }

      .template-section {
        margin-top: 30px;
      }

      .template-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .template-tabs {
        display: inline-flex;
        align-items: center;
        gap: 28px;
      }

      .template-tab {
        position: relative;
        border: 0;
        background: transparent;
        color: #5f6876;
        cursor: pointer;
        font-size: 15px;
        font-weight: 720;
      }

      .template-tab.active {
        color: #171717;
      }

      .template-tab.active::after {
        position: absolute;
        right: 0;
        bottom: -10px;
        left: 0;
        height: 2px;
        border-radius: 999px;
        background: #171717;
        content: "";
      }

      .template-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .template-search,
      .template-sort {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.76);
        color: #5f6876;
        box-shadow: 0 6px 16px rgba(32, 44, 62, 0.05);
      }

      .template-search {
        width: 210px;
        padding: 0 12px;
      }

      .template-search input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: #303844;
        font-size: 13px;
      }

      .template-search input::placeholder {
        color: #98a2af;
      }

      .template-sort {
        padding: 0 13px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 680;
      }

      .template-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .template-card {
        display: flex;
        min-height: 164px;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 24px 18px;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
        color: #5f6876;
        cursor: pointer;
        text-align: left;
        box-shadow: 0 10px 26px rgba(32, 44, 62, 0.06);
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .template-card:hover {
        border-color: rgba(23, 23, 23, 0.2);
        box-shadow: 0 16px 34px rgba(32, 44, 62, 0.1);
        transform: translateY(-1px);
      }

      .template-card-title {
        display: block;
        margin: 0;
        color: #20242a;
        font-size: 18px;
        font-weight: 780;
        line-height: 1.28;
      }

      .template-card-desc {
        display: block;
        margin: 12px 0 0;
        color: #6f7784;
        font-size: 14px;
        font-weight: 450;
        line-height: 1.65;
      }

      .template-card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 18px;
        color: #8b95a3;
        font-size: 13px;
      }

      .template-tag {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border-radius: 8px;
        background: #f0f2f5;
        color: #5f6876;
        font-weight: 650;
      }

      .template-arrow {
        font-size: 20px;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .tasks {
          display: none;
        }

        main {
          padding: 28px 18px;
        }

        .template-grid {
          grid-template-columns: 1fr;
        }

        .template-bar {
          align-items: flex-start;
          flex-direction: column;
        }

        .template-actions,
        .template-search {
          width: 100%;
        }
      }

      /* __SIDEBAR_OVERRIDE_START__ */

      /* Unified sidebar lock: keep the left navigation identical on every page. */

        display: grid !important;
        grid-template-columns: 282px minmax(0, 1fr) !important;
        min-height: 100vh !important;
      }

      }

      }

      }

  <body>
    <div class="app" id="appShell">
      <aside class="sidebar" aria-label="左侧导航">
        <div class="brand">
          <span>感知Agent</span>
        </div>
        <button class="new-task" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          新建任务
        </button>
        <nav class="primary-menu" aria-label="功能导航">
          <button class="primary-menu-button" type="button" onclick="location.href='agent-management.html'"><svg class="primary-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z" /><path d="M9 12h6" /><path d="M12 9v6" /></svg><span class="primary-label">Agent</span></button>
          <div class="nav-stack agent-nav" aria-label="Agent功能">
            <button class="nav-button" type="button" onclick="location.href='index.html'">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 2 2 4-5" /><path d="M20 12a8 8 0 1 1-3.1-6.3" /><path d="M18 4h3v3" /></svg>
              </span>
              巡检捉虫
            </button>
            <button class="nav-button" type="button" onclick="location.href='opinion.html'">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4" /></svg>
              </span>
              舆情分析
            </button>
          </div>
          <button class="primary-menu-button" type="button" onclick="location.href='skill.html'"><svg class="primary-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" /><path d="M12 12l8-4.5" /><path d="M12 12v9" /><path d="M12 12 4 7.5" /></svg><span class="primary-label">Skill</span></button>
