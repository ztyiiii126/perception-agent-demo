<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新建任务 - 感知Agent</title>
    <style>
      :root {
        --panel-soft: #f3f6fa;
        --text: #20242a;
        --muted: #737d8c;
        --line: #dde5ec;
        --accent: #3b6ef6;
        --shadow: 0 22px 60px rgba(32, 44, 62, 0.11);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 62% 0%, rgba(255, 255, 255, 0.94) 0 18%, transparent 42%),
          linear-gradient(135deg, #f3f6fa 0%, #fbfcfd 50%, #edf7f3 100%);
        color: var(--text);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 282px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 22px 16px;
        border-right: 1px solid rgba(223, 216, 203, 0.78);
        background: rgba(244, 247, 249, 0.86);
        backdrop-filter: blur(18px);
      }

      .brand {
        padding: 6px 10px 10px;
        font-size: 22px;
        font-weight: 840;
        line-height: 1.15;
      }

      .new-task {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 14px;
        background: #171717;
        color: #fff;
        cursor: pointer;
        font-weight: 650;
        box-shadow: 0 12px 26px rgba(23, 23, 23, 0.16);
      }

      .primary-menu,
      .nav-stack,
      .task-stack {
        display: grid;
        gap: 8px;
      }

      .primary-menu-button {
        display: flex;
        align-items: center;
        min-height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #4c5563;
        cursor: pointer;
        font-weight: 760;
        font-size: 14px;
        text-align: left;
      }

      .agent-nav {
        margin-left: 12px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }

      .nav-button,
      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }

      .nav-button {
        padding: 0 12px;
        font-weight: 650;
      }

      .nav-icon {
        display: grid;
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 9px;
        background: var(--panel-soft);
        color: #504b44;
      }

      .tasks {
        display: flex;
        min-height: 0;
        margin-top: 14px;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }

      .section-title {
        display: block;
        padding: 0 10px;
        color: #9a9285;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .task-item {
        padding: 10px;
      }

      .task-name {
        overflow: hidden;
        color: #38342e;
        font-size: 14px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      main {
        min-width: 0;
        padding: 38px 44px 34px;
      }

      .topbar,
      .workspace {
        width: min(100%, 930px);
        margin: 0 auto;
      }

      .topbar {
        margin-bottom: 54px;
        color: var(--muted);
        font-size: 14px;
      }

      h1 {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(22px, 2.1vw, 28px);
        font-weight: 760;
        line-height: 1.15;
      }

      .chat-panel {
        overflow: hidden;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow);
      }

      .prompt-area {
        display: flex;
        min-height: 282px;
        flex-direction: column;
        justify-content: space-between;
        padding: 26px 28px 18px;
      }

      .prompt-input {
        width: 100%;
        min-height: 162px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: #3f4650;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.85;
      }

      .prompt-input::placeholder {
        color: #9aa4b2;
      }

      .prompt-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 18px;
        margin-top: 28px;
      }

      .config-tools {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .config-menu {
        position: relative;
      }

      .config-menu summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #f7f9fb;
        color: #47505d;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        list-style: none;
      }

      .config-menu summary::-webkit-details-marker {
        display: none;
      }

      .config-count {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        background: #e9edf3;
        color: #59636e;
        font-size: 12px;
        font-weight: 760;
      }

      .config-panel {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 0;
        z-index: 3;
        width: 280px;
        padding: 12px;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 42px rgba(32, 44, 62, 0.16);
      }

      .config-title {
        margin-bottom: 10px;
        color: #6f7784;
        font-size: 12px;
        font-weight: 760;
      }

      .config-option {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        color: #303844;
        font-size: 13px;
        line-height: 1.35;
      }

      .config-option input {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
      }

      .run-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #b3cbff;
        color: #fff;
        cursor: pointer;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .run-button:hover {
        background: var(--accent);
        transform: translateY(-1px);
      }

      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .run-button svg {
        width: 22px;
        height: 22px;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .tasks {
          display: none;
        }

        main {
          padding: 28px 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="左侧导航">
        <div class="brand">感知Agent</div>
        <button class="new-task" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          新建任务
        </button>
        <nav class="primary-menu" aria-label="功能导航">
          <button class="primary-menu-button" type="button" onclick="location.href='agent-management.html'">Agent</button>
          <div class="nav-stack agent-nav" aria-label="Agent功能">
            <button class="nav-button" type="button" onclick="location.href='index.html'">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 2 2 4-5" /><path d="M20 12a8 8 0 1 1-3.1-6.3" /><path d="M18 4h3v3" /></svg>
              </span>
              巡检捉虫
            </button>
            <button class="nav-button" type="button" onclick="location.href='opinion.html'">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4" /></svg>
              </span>
              舆情分析
            </button>
          </div>
          <button class="primary-menu-button" type="button" onclick="location.href='skill.html'">Skill</button>
          <button class="primary-menu-button" type="button" onclick="location.href='tools.html'">工具集</button>
          <button class="primary-menu-button" type="button" onclick="location.href='knowledge.html'">知识库</button>
          <button class="primary-menu-button" type="button" onclick="location.href='effect-monitor.html'">效果监控</button>
        </nav>
        <section class="tasks" aria-label="任务列表">
          <a class="section-title" href="task-list.html">任务列表</a>
          <div class="task-stack">
            <button class="task-item" type="button"><span class="task-name">榴莲虚假宣传直播间巡检</span></button>
            <button class="task-item" type="button"><span class="task-name">AWLS社交平台舆情风险定级</span></button>
            <button class="task-item" type="button"><span class="task-name">通用风险线索研判任务</span></button>
          </div>
        </section>
      </aside>

      <main>
        <div class="topbar">新建任务 / 通用入口</div>
        <section class="workspace" aria-labelledby="page-title">
          <h1 id="page-title">感知Agent</h1>
          <section class="chat-panel" aria-label="通用任务输入">
            <div class="prompt-area">
              <textarea
                class="prompt-input"
                aria-label="任务描述"
                placeholder="直接描述你想完成的任务。平台会理解任务意图，并选择合适的 Agent、Skill、工具和知识库执行。"
              ></textarea>
              <div class="prompt-toolbar">
                <div class="config-tools" aria-label="任务调用配置">
                  <details class="config-menu">
                    <summary>Skill <span class="config-count">9</span></summary>
                    <div class="config-panel">
                      <div class="config-title">选择本次任务可调用的 Skill</div>
                      <label class="config-option"><input type="checkbox" checked />生鲜直播间虚假宣传</label>
                      <label class="config-option"><input type="checkbox" checked />服装直播间材质违规</label>
                      <label class="config-option"><input type="checkbox" />空调直播间售卖假货</label>
                      <label class="config-option"><input type="checkbox" />玉石直播间低价引流</label>
                    </div>
                  </details>
                  <details class="config-menu">
                    <summary>工具 <span class="config-count">6</span></summary>
                    <div class="config-panel">
                      <div class="config-title">选择本次任务可调用的工具</div>
                      <label class="config-option"><input type="checkbox" checked />手机浏览</label>
                      <label class="config-option"><input type="checkbox" checked />网页浏览</label>
                      <label class="config-option"><input type="checkbox" checked />商品查询</label>
                      <label class="config-option"><input type="checkbox" />直播间查询</label>
                    </div>
                  </details>
                  <details class="config-menu">
                    <summary>知识库 <span class="config-count">3</span></summary>
                    <div class="config-panel">
                      <div class="config-title">选择本次任务检索参考的知识库</div>
                      <label class="config-option"><input type="checkbox" checked />巡检黑样本发散</label>
                      <label class="config-option"><input type="checkbox" checked />G1材质词库和关联关系</label>
                      <label class="config-option"><input type="checkbox" />舆情红线法规</label>
                    </div>
                  </details>
                </div>
                <button class="run-button" type="button" aria-label="提交任务" onclick="location.href='task-list.html'">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
                </button>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
