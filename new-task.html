<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新建任务 - 感知Agent</title>
    <style>
      :root {
        --panel-soft: #f3f6fa;
        --text: #20242a;
        --muted: #737d8c;
        --line: #dde5ec;
        --accent: #171717;
        --shadow: 0 22px 60px rgba(32, 44, 62, 0.11);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 62% 0%, rgba(255, 255, 255, 0.94) 0 18%, transparent 42%),
          linear-gradient(135deg, #f3f6fa 0%, #fbfcfd 50%, #edf7f3 100%);
        color: var(--text);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 282px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 22px 16px;
        border-right: 1px solid rgba(223, 216, 203, 0.78);
        background: rgba(244, 247, 249, 0.86);
        backdrop-filter: blur(18px);
      }

      .brand {
        padding: 6px 10px 10px;
        font-size: 22px;
        font-weight: 840;
        line-height: 1.15;
      }

      .new-task {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 650;
        box-shadow: 0 12px 26px rgba(23, 23, 23, 0.18);
      }

      .primary-menu,
      .nav-stack,
      .task-stack {
        display: grid;
        gap: 8px;
      }

      .primary-menu-button {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #4c5563;
        cursor: pointer;
        font-weight: 760;
        font-size: 14px;
        text-align: left;
      }

      .primary-icon {
        display: block;
        flex: 0 0 18px;
        width: 18px;
        height: 18px;
        margin: 0;
      }

      .primary-label {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        line-height: 1;
      }

      .agent-nav {
        margin-left: 12px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }

      .nav-button,
      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
        text-decoration: none;
      }

      .nav-button {
        padding: 0 12px;
        font-weight: 650;
      }

      .nav-icon {
        display: grid;
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 9px;
        background: var(--panel-soft);
        color: #504b44;
      }

      .tasks {
        display: flex;
        min-height: 0;
        margin-top: 14px;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }

      .section-title {
        display: block;
        padding: 0 10px;
        color: #9a9285;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .task-item {
        padding: 10px;
      }

      .task-name {
        overflow: hidden;
        color: #38342e;
        font-size: 14px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }



      .agent-nav .nav-button {
        min-height: 36px;
        padding: 0 10px;
        color: #6a7482;
        font-size: 13px;
        font-weight: 620;
      }

      .agent-nav .nav-icon {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: transparent;
        color: #6f7784;
      }

      .agent-nav .nav-button.active {
        background: rgba(255, 255, 255, 0.56);
        color: #303844;
      }

      .agent-nav .nav-button.active .nav-icon {
        background: transparent;
        color: var(--accent);
      }


      .app {
        transition: grid-template-columns 180ms ease;
      }

      .app.sidebar-collapsed {
        grid-template-columns: 78px minmax(0, 1fr);
      }

      .sidebar {
        overflow: hidden;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .app.sidebar-collapsed .sidebar {
        gap: 16px;
        padding: 20px 12px;
      }

      .app.sidebar-collapsed .brand {
        justify-content: center;
        padding: 4px 0 8px;
      }

      .app.sidebar-collapsed .brand span,
      .app.sidebar-collapsed .new-task span,
      .app.sidebar-collapsed .primary-label,
      .app.sidebar-collapsed .nav-label,
      .app.sidebar-collapsed .task-name,
      .app.sidebar-collapsed .section-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        transform: translateX(-6px);
        pointer-events: none;
      }

      .app.sidebar-collapsed .new-task,
      .app.sidebar-collapsed .primary-menu-button,
      .app.sidebar-collapsed .nav-button,
      .app.sidebar-collapsed .task-item {
        justify-content: center;
        width: 46px;
        padding: 0;
      }

      .app.sidebar-collapsed .primary-menu-button {
        gap: 0;
      }

      .app.sidebar-collapsed .agent-nav {
        margin-left: 0;
        padding-left: 0;
        border-left: 0;
      }

      .app.sidebar-collapsed .tasks {
        display: none;
      }

      main {
        min-width: 0;
        padding: 38px 44px 34px;
      }

      .topbar,
      .workspace {
        width: min(100%, 930px);
        margin: 0 auto;
      }

      .topbar {
        margin-bottom: 54px;
        color: var(--muted);
        font-size: 14px;
      }

      h1 {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(22px, 2.1vw, 28px);
        font-weight: 760;
        line-height: 1.15;
      }

      .chat-panel {
        overflow: visible;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow);
      }

      .prompt-area {
        display: flex;
        min-height: 282px;
        flex-direction: column;
        justify-content: space-between;
        padding: 26px 28px 18px;
      }

      .prompt-input {
        width: 100%;
        min-height: 162px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: #3f4650;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.85;
      }

      .prompt-input::placeholder {
        color: #9aa4b2;
      }

      .prompt-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 18px;
        margin-top: 28px;
      }

      .config-tools {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .expand-menu {
        position: relative;
      }

      .expand-menu summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 4px 0 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #f7f9fb;
        color: #47505d;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        list-style: none;
      }

      .expand-menu summary::-webkit-details-marker {
        display: none;
      }

      .expand-count,
      .config-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        min-width: 38px;
        padding: 0 9px;
        border-radius: 9px;
        background: #e9edf3;
        color: #303844;
        font-size: 14px;
        font-weight: 760;
      }

      .expand-panel {
        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        z-index: 3;
        overflow: hidden;
        width: 280px;
        padding: 0;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 42px rgba(32, 44, 62, 0.16);
      }

      .config-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 58px;
        padding: 0 14px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: #20242a;
        cursor: pointer;
        font-size: 16px;
        font-weight: 760;
        text-align: left;
      }

      .config-row:hover {
        background: #f7f9fb;
      }

      .config-icon {
        display: grid;
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        place-items: center;
        color: #303844;
      }

      .config-label {
        flex: 1;
      }

      .config-count {
        min-width: 34px;
        height: 28px;
        border-radius: 999px;
        color: #59636e;
        font-size: 13px;
      }

      .config-arrow {
        color: #20242a;
      }

      .config-summary {
        padding: 15px 16px;
        background: #fbfcfd;
        color: #5f6876;
        font-size: 14px;
        font-weight: 650;
      }

      .run-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .run-button:hover {
        background: var(--accent);
        transform: translateY(-1px);
      }

      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .run-button svg {
        width: 22px;
        height: 22px;
      }

      .template-section {
        margin-top: 30px;
      }

      .template-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .template-tabs {
        display: inline-flex;
        align-items: center;
        gap: 28px;
      }

      .template-tab {
        position: relative;
        border: 0;
        background: transparent;
        color: #5f6876;
        cursor: pointer;
        font-size: 15px;
        font-weight: 720;
      }

      .template-tab.active {
        color: #171717;
      }

      .template-tab.active::after {
        position: absolute;
        right: 0;
        bottom: -10px;
        left: 0;
        height: 2px;
        border-radius: 999px;
        background: #171717;
        content: "";
      }

      .template-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .template-search,
      .template-sort {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.76);
        color: #5f6876;
        box-shadow: 0 6px 16px rgba(32, 44, 62, 0.05);
      }

      .template-search {
        width: 210px;
        padding: 0 12px;
      }

      .template-search input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: #303844;
        font-size: 13px;
      }

      .template-search input::placeholder {
        color: #98a2af;
      }

      .template-sort {
        padding: 0 13px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 680;
      }

      .template-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .template-card {
        display: flex;
        min-height: 164px;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 24px 18px;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
        color: #5f6876;
        cursor: pointer;
        text-align: left;
        box-shadow: 0 10px 26px rgba(32, 44, 62, 0.06);
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .template-card:hover {
        border-color: rgba(23, 23, 23, 0.2);
        box-shadow: 0 16px 34px rgba(32, 44, 62, 0.1);
        transform: translateY(-1px);
      }

      .template-card-title {
        display: block;
        margin: 0;
        color: #20242a;
        font-size: 18px;
        font-weight: 780;
        line-height: 1.28;
      }

      .template-card-desc {
        display: block;
        margin: 12px 0 0;
        color: #6f7784;
        font-size: 14px;
        font-weight: 450;
        line-height: 1.65;
      }

      .template-card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 18px;
        color: #8b95a3;
        font-size: 13px;
      }

      .template-tag {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border-radius: 8px;
        background: #f0f2f5;
        color: #5f6876;
        font-weight: 650;
      }

      .template-arrow {
        font-size: 20px;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .tasks {
          display: none;
        }

        main {
          padding: 28px 18px;
        }

        .template-grid {
          grid-template-columns: 1fr;
        }

        .template-bar {
          align-items: flex-start;
          flex-direction: column;
        }

        .template-actions,
        .template-search {
          width: 100%;
        }
      }

      /* Form task creation */
      main {
        min-width: 0;
        padding: 30px 42px 48px;
      }

      .form-page {
        width: min(1120px, 100%);
        margin: 0 auto;
      }

      .form-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      .form-head h1 {
        margin: 5px 0 0;
        font-size: 26px;
        line-height: 1.2;
      }

      .form-head p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .draft-state {
        color: #737d8c;
        font-size: 12px;
      }

      .stepper {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        overflow: hidden;
      }

      .step-tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 15px 18px;
        border: 0;
        border-right: 1px solid var(--line);
        background: transparent;
        color: #8a939f;
        cursor: pointer;
        text-align: left;
      }

      .step-tab:last-child {
        border-right: 0;
      }

      .step-tab.active {
        background: #171717;
        color: #fff;
      }

      .step-tab.complete {
        color: #303844;
      }

      .step-number {
        display: grid;
        flex: 0 0 24px;
        width: 24px;
        height: 24px;
        place-items: center;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 11px;
        font-weight: 760;
      }

      .step-label {
        overflow: hidden;
        font-size: 13px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .form-shell {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .form-step {
        display: none;
        min-height: 470px;
        padding: 28px 30px;
      }

      .form-step.active {
        display: block;
      }

      .step-heading {
        margin-bottom: 24px;
      }

      .step-heading h2 {
        margin: 0;
        font-size: 18px;
      }

      .step-heading p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .choice-card {
        position: relative;
        display: block;
        min-height: 138px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .choice-card:hover {
        border-color: #aeb7c2;
      }

      .choice-card.selected {
        border-color: #171717;
        background: #f6f7f8;
        box-shadow: 0 0 0 1px #171717;
      }

      .choice-card input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .choice-check {
        position: absolute;
        top: 17px;
        right: 17px;
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border: 1px solid #cbd3dc;
        border-radius: 50%;
        color: transparent;
        font-size: 12px;
      }

      .choice-card.selected .choice-check {
        border-color: #171717;
        background: #171717;
        color: #fff;
      }

      .choice-title {
        display: block;
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 760;
      }

      .choice-desc {
        display: block;
        max-width: 90%;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 20px;
      }

      .field {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field-label {
        color: #343a43;
        font-size: 13px;
        font-weight: 720;
      }

      .required {
        margin-left: 3px;
        color: #d74c43;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid #d8e0e7;
        border-radius: 10px;
        outline: 0;
        background: #fff;
        color: #303844;
        font: inherit;
        font-size: 13px;
      }

      .field textarea {
        min-height: 92px;
        padding: 11px 12px;
        resize: vertical;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: #737d8c;
        box-shadow: 0 0 0 3px rgba(23, 23, 23, 0.06);
      }

      .condition-row {
        display: grid;
        grid-template-columns: 1.3fr 0.8fr 1fr;
        gap: 10px;
      }

      .source-panel {
        display: none;
      }

      .source-panel.active {
        display: block;
      }

      .source-note {
        margin-bottom: 18px;
        padding: 12px 14px;
        border: 1px solid #e1e6eb;
        border-radius: 10px;
        background: #f7f8f9;
        color: #66717f;
        font-size: 12px;
      }

      .segment {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid #d8e0e7;
        border-radius: 10px;
        background: #f4f6f8;
      }

      .segment label {
        cursor: pointer;
      }

      .segment input {
        position: absolute;
        opacity: 0;
      }

      .segment span {
        display: block;
        padding: 8px 15px;
        border-radius: 7px;
        color: #697481;
        font-size: 13px;
        font-weight: 650;
      }

      .segment input:checked + span {
        background: #171717;
        color: #fff;
      }

      .inline-field {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .inline-field input[type="number"] {
        width: 96px;
      }

      .inline-field select {
        width: 92px;
        min-height: 42px;
        padding: 0 10px;
        border: 1px solid #dce3ec;
        border-radius: 6px;
        outline: 0;
        background: #fff;
        color: #48566b;
        font: inherit;
        font-size: 13px;
      }

      .inline-field select:focus {
        border-color: var(--form-blue);
        box-shadow: 0 0 0 2px rgba(23, 25, 28, 0.08);
      }

      .scheduled-config {
        display: grid;
        gap: 14px;
        margin: 2px 0 4px;
        padding: 0;
      }

      .radio-list {
        display: grid;
        gap: 14px;
        padding: 4px 0;
      }

      .radio-option-line {
        display: grid;
        grid-template-columns: 150px minmax(0, 300px);
        align-items: center;
        gap: 20px;
      }

      .radio-option {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 150px;
        color: #252a31;
        cursor: pointer;
        font-size: 14px;
        font-weight: 650;
      }

      .radio-option input {
        position: absolute;
        opacity: 0;
      }

      .radio-dot {
        display: grid;
        flex: 0 0 18px;
        width: 18px;
        height: 18px;
        place-items: center;
        border: 1.5px solid #9aa2ad;
        border-radius: 50%;
        background: #fff;

      .scheduled-config-content {

      .switch-line {

      .summary-list {

        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .summary-row {

      .summary-label {

      .summary-value {

      .form-actions {

      /* Premium form visual system */
      :root {
        --page-bg: #f5f6f7;
        --surface: #ffffff;
        --surface-subtle: #f8f9fa;
        --surface-muted: #f1f3f5;
        --text: #17191c;
        --text-secondary: #59616c;
        --muted: #858d98;
        --line: #e2e5e9;
        --line-strong: #cfd4da;
        --accent: #17191c;
        --danger: #c93f36;
        --success: #16845b;
        --shadow: 0 18px 48px rgba(25, 31, 38, 0.07);
        --shadow-small: 0 8px 22px rgba(25, 31, 38, 0.06);
      }

      body {
        background: var(--page-bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        letter-spacing: 0;
      }

      main {
        padding: 42px 52px 60px;
        background: var(--page-bg);
      }

      .form-page {
        width: min(1080px, 100%);
      }

      .form-head {
        align-items: flex-start;
        margin-bottom: 28px;
      }

      .topbar {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 680;
      }

      .form-head h1 {
        margin: 0;
        color: var(--text);
        font-size: 28px;
        font-weight: 760;
        line-height: 1.22;
      }

      .form-head p {
        max-width: 600px;
        margin-top: 10px;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.65;
      }

      .draft-state {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 4px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.74);
        color: var(--muted);
        font-size: 12px;
        font-weight: 620;
      }

      .draft-state::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        content: "";
      }

      .stepper {
        position: relative;
        gap: 0;
        margin-bottom: 18px;
        padding: 5px;
        border-color: var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 1px 2px rgba(25, 31, 38, 0.02);
      }

      .step-tab {
        min-height: 54px;
        padding: 10px 14px;
        border-right: 0;
        border-radius: 8px;
        color: var(--muted);
        transition:
          background-color 160ms ease,
          color 160ms ease,
          box-shadow 160ms ease;
      }

      .step-tab:hover {
        background: var(--surface-subtle);
        color: var(--text-secondary);
      }

      .step-tab.active {
        background: var(--surface-muted);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(23, 25, 28, 0.04);
      }

      .step-tab.complete {
        color: var(--text-secondary);
      }

      .step-number {
        width: 25px;
        height: 25px;
        border-color: var(--line-strong);
        background: var(--surface);
        color: var(--muted);
        font-size: 11px;
        font-weight: 760;
      }

      .step-tab.active .step-number {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .step-tab.complete .step-number {
        border-color: #9fa6ae;
        color: var(--text-secondary);
      }

      .step-label {
        font-size: 13px;
        font-weight: 680;
      }

      .form-shell {
        border-color: var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .form-step {
        min-height: 500px;
        padding: 34px 38px 40px;
      }

      .step-heading {
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .step-heading h2 {
        color: var(--text);
        font-size: 19px;
        font-weight: 740;
        line-height: 1.3;
      }

      .step-heading p {
        margin-top: 7px;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.6;
      }

      .choice-grid {
        gap: 16px;
      }

      .choice-card {
        min-height: 148px;
        padding: 22px 46px 22px 22px;
        border-color: var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(25, 31, 38, 0.025);
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      .choice-card:hover {
        transform: translateY(-1px);
        border-color: #b9bec5;
        box-shadow: var(--shadow-small);
      }

      .choice-card.selected {
        border-color: var(--accent);
        background: var(--surface-subtle);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .choice-card:focus-within {
        outline: 3px solid rgba(23, 25, 28, 0.1);
        outline-offset: 2px;
      }

      .choice-check {
        top: 20px;
        right: 20px;
        width: 21px;
        height: 21px;
        border-color: var(--line-strong);
        background: var(--surface);
        font-size: 11px;
      }

      .choice-card.selected .choice-check {
        border-color: var(--accent);
        background: var(--accent);
      }

      .choice-title {
        margin-bottom: 8px;
        color: var(--text);
        font-size: 15px;
        font-weight: 720;
      }

      .choice-desc {
        max-width: 96%;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.7;
      }

      .field-grid {
        gap: 22px 24px;
      }

      .field {
        gap: 9px;
      }

      .field-label {
        color: #343940;
        font-size: 13px;
        font-weight: 680;
      }

      .required {
        color: var(--danger);
      }

      .field input,
      .field select,
      .field textarea {
        min-height: 44px;
        padding: 0 13px;
        border-color: var(--line-strong);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease,
          background-color 150ms ease;
      }

      .field input:hover,
      .field select:hover,
      .field textarea:hover {
        border-color: #abb2bb;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(23, 25, 28, 0.09);
      }

      .field input[readonly] {
        border-color: var(--line);
        background: var(--surface-muted);
        color: var(--text-secondary);
      }

      .condition-row {
        gap: 12px;
      }

      .source-note {
        margin-bottom: 24px;
        padding: 11px 13px;
        border-color: var(--line);
        border-radius: 8px;
        background: var(--surface-muted);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 620;
      }

      .segment {
        gap: 4px;
        padding: 4px;
        border-color: var(--line-strong);
        border-radius: 9px;
        background: var(--surface-muted);
      }

      .segment span {
        min-width: 112px;
        padding: 8px 14px;
        border-radius: 6px;
        color: var(--text-secondary);
        text-align: center;
        transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      .segment label:hover span {
        color: var(--text);
      }

      .segment input:checked + span {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 4px rgba(25, 31, 38, 0.12);
      }

      .switch-line {
        min-height: 54px;
        padding: 0 15px;
        border-color: var(--line-strong);
        border-radius: 9px;
        transition: border-color 150ms ease, background-color 150ms ease;
      }

      .switch-line:hover {
        border-color: #abb2bb;
        background: var(--surface-subtle);
      }

      .switch-line input {
        width: 40px;
        height: 22px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .summary-list {
        border-color: var(--line);
        border-radius: 10px;
      }

      .summary-row {
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 24px;
        padding: 13px 15px;
        border-top-color: var(--line);
        background: var(--surface);
      }

      .summary-row:nth-child(even) {
        background: var(--surface-subtle);
      }

      .summary-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 620;
      }

      .summary-value {
        color: var(--text);
        font-size: 13px;
        font-weight: 620;
      }

      .form-actions {
        position: sticky;
        bottom: 0;
        z-index: 2;
        padding: 15px 20px;
        border-top-color: var(--line);
        background: rgba(250, 251, 252, 0.94);
        backdrop-filter: blur(14px);
      }

      .form-button {
        min-height: 40px;
        padding: 0 17px;
        border-color: var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 680;
        transition:
          transform 150ms ease,
          border-color 150ms ease,
          background-color 150ms ease,
          color 150ms ease,
          box-shadow 150ms ease;
      }

      .form-button:hover {
        border-color: #aeb5bd;
        background: var(--surface-muted);
        color: var(--text);
      }

      .form-button:active {
        transform: translateY(1px);
      }

      .form-button:focus-visible,
      .step-tab:focus-visible {
        outline: 3px solid rgba(23, 25, 28, 0.12);
        outline-offset: 2px;
      }

      .form-button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 14px rgba(23, 25, 28, 0.14);
      }

      .form-button.primary:hover {
        border-color: #30343a;
        background: #30343a;
        color: #fff;
        box-shadow: 0 8px 18px rgba(23, 25, 28, 0.18);
      }

      @media (max-width: 1100px) {
        main {
          padding: 34px 28px 48px;
        }

        .form-step {
          padding: 30px 28px 36px;
        }
      }

      @media (max-width: 760px) {

        }

      /* Reference-inspired visual layer */
      :root {

        --form-blue-line: #cfd4da;
      }

      body,
      main {
        background: #fff;

      .help-tip {
        position: relative;
        display: inline-grid;
        width: 16px;
        height: 16px;
        place-items: center;
        border: 1px solid #aeb5bd;
        border-radius: 50%;
        color: #747e8b;
        cursor: help;
        font-size: 10px;
        font-weight: 700;
      }

      .help-tip::after {
        position: absolute;
        z-index: 30;
        bottom: calc(100% + 8px);
        left: 50%;
        width: max-content;
        max-width: 260px;
        padding: 7px 9px;
        border-radius: 5px;
        background: #252a31;
        color: #fff;
        content: attr(data-tip);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.5;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 4px);
        transition: opacity 120ms ease, transform 120ms ease;

      .help-tip:hover::after,
      .help-tip:focus::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .form-step[data-step="4"] .scheduled-config {

      /* Unified compact selection circles */

        height: 14px;

      .choice-card.selected .choice-check,

    <script>
      let currentStep = 1;
      const steps = document.querySelectorAll(".form-step");
      const stepTabs = document.querySelectorAll(".step-tab");
      const prevButton = document.querySelector("#prevStep");
      const nextButton = document.querySelector("#nextStep");
      const createButton = document.querySelector("#createTask");
      const cancelButton = document.querySelector("#cancelTask");
      const inspectionTypeInputs = document.querySelectorAll('input[name="inspectionType"]');
      const hitRuleList = document.querySelector("#hitRuleList");

      const hitRuleFields = [
        {
          value: "liveReportCount",
          label: "直播间举报数",
          operators: ["大于", "大等于", "等于", "小于", "小等于"],
          type: "number",
        },
      ];

      function updateInspectionType() {
        const selectedType = document.querySelector('input[name="inspectionType"]:checked').value;
        inspectionTypeInputs.forEach((input) => {
          input.closest("label").classList.toggle("selected", input.checked);
        });
        document.querySelectorAll("[data-inspection-config]").forEach((panel) => {
          panel.hidden = panel.dataset.inspectionConfig !== selectedType;
        });
      }

      function updateGovernanceCards() {
        document.querySelectorAll('input[name="governance"]').forEach((input) => {
          input.closest(".choice-card").classList.toggle("selected", input.checked);
        });
      }

      function availableHitRuleFields() {
        return hitRuleFields;
      }

      function multiDropdownMarkup(options) {
        return `
          <details class="dynamic-value multi-dropdown" data-placeholder="请选择">
            <summary>请选择</summary>
            <div class="multi-dropdown-menu">
              <label class="multi-dropdown-option"><input type="checkbox" data-select-all />全选</label>
              ${options.map((option) => `<label class="multi-dropdown-option"><input type="checkbox" value="${option}" />${option}</label>`).join("")}
            </div>
          </details>
        `;
      }

      function updateMultiDropdown(dropdown) {
        const options = [...dropdown.querySelectorAll('input[type="checkbox"]:not([data-select-all])')];
        const selected = options.filter((input) => input.checked);
        const selectAll = dropdown.querySelector("[data-select-all]");
        selectAll.checked = options.length > 0 && selected.length === options.length;
        selectAll.indeterminate = selected.length > 0 && selected.length < options.length;
        dropdown.querySelector("summary").textContent = selected.length === 0
          ? dropdown.dataset.placeholder
          : selected.length === options.length
            ? "全选"
            : selected.map((input) => input.value).join("、");
      }

      function bindMultiDropdown(dropdown) {
        dropdown.querySelectorAll('input[type="checkbox"]').forEach((input) => {
          input.addEventListener("change", () => {
            if (input.matches("[data-select-all]")) {
              dropdown.querySelectorAll('input[type="checkbox"]:not([data-select-all])').forEach((option) => {
                option.checked = input.checked;
              });
            }
            updateMultiDropdown(dropdown);
          });
        });
        updateMultiDropdown(dropdown);
      }

      function renderHitRuleValue(row) {
        const field = hitRuleFields.find((item) => item.value === row.querySelector(".dynamic-field").value);
        if (!field) return;
        row.querySelector(".dynamic-operator").innerHTML = field.operators.map((operator) => `<option>${operator}</option>`).join("");
        const currentValue = row.querySelector(".dynamic-value");
        const nextValue = field.type === "multiple"
          ? multiDropdownMarkup(field.options)
          : `<input class="dynamic-value" type="number" min="0" value="1" aria-label="命中字段" />`;
        currentValue.outerHTML = nextValue;
        const dropdown = row.querySelector(".multi-dropdown");
        if (dropdown) bindMultiDropdown(dropdown);
      }

      function ensureHitRuleEmptyState() {
        if (!hitRuleList.querySelector(".dynamic-rule-row")) {
          hitRuleList.innerHTML = `<div class="dynamic-rule-empty">点击“添加条件”配置命中规则</div>`;
        }
      }

      function updateRuleNumbers() {
        hitRuleList.querySelectorAll(".dynamic-rule-row").forEach((row, index) => {
          row.querySelector(".rule-number").textContent = index + 1;
        });
      }

      function addHitRule(fieldValue, operatorValue, hitValues = []) {
        const fields = availableHitRuleFields();
        if (!fields.length) return;
        hitRuleList.querySelector(".dynamic-rule-empty")?.remove();
        const row = document.createElement("div");
        row.className = "dynamic-rule-row";
        row.innerHTML = `
          <span class="rule-number"></span>
          <select class="dynamic-field" aria-label="条件字段">${fields.map((field) => `<option value="${field.value}">${field.label}</option>`).join("")}</select>
          <select class="dynamic-operator" aria-label="操作符"></select>
          <input class="dynamic-value" aria-label="命中字段" />
          <button class="remove-rule-button" type="button" aria-label="删除条件">×</button>
        `;
        row.querySelector(".dynamic-field").addEventListener("change", () => renderHitRuleValue(row));
        row.querySelector(".remove-rule-button").addEventListener("click", () => {
          row.remove();
          updateRuleNumbers();
          ensureHitRuleEmptyState();
        });
        hitRuleList.appendChild(row);
        updateRuleNumbers();
        if (fieldValue) row.querySelector(".dynamic-field").value = fieldValue;
        renderHitRuleValue(row);
        if (operatorValue) row.querySelector(".dynamic-operator").value = operatorValue;
        const valueControl = row.querySelector(".dynamic-value");
        if (valueControl.matches(".multi-dropdown")) {
          valueControl.querySelectorAll('input[type="checkbox"]:not([data-select-all])').forEach((option) => {
            option.checked = hitValues.includes(option.value);
          });
          updateMultiDropdown(valueControl);
        } else if (hitValues.length) {
          valueControl.value = hitValues[0];
        }
      }

      function showStep(step) {
        currentStep = Math.max(1, Math.min(4, step));
        steps.forEach((item) => item.classList.toggle("active", Number(item.dataset.step) === currentStep));
        stepTabs.forEach((item) => {
          const number = Number(item.dataset.stepTarget);
          item.classList.toggle("active", number === currentStep);
          item.classList.toggle("complete", number < currentStep);
        });
        prevButton.hidden = currentStep === 1;
        cancelButton.hidden = currentStep !== 1;
        nextButton.hidden = currentStep === 4;
        createButton.hidden = currentStep !== 4;
      }

      document.querySelectorAll('input[name="governance"]').forEach((input) => {
        input.addEventListener("change", updateGovernanceCards);
      });
      inspectionTypeInputs.forEach((input) => input.addEventListener("change", updateInspectionType));
      document.querySelector("#addHitRule").addEventListener("click", () => addHitRule());
      document.querySelectorAll('input[name="deadlineType"]').forEach((input) => {
        input.addEventListener("change", () => {
          const deadlineType = document.querySelector('input[name="deadlineType"]:checked').value;
          document.querySelector("#deadlineDateField").hidden = deadlineType !== "date";
        });
      });
      document.querySelectorAll(".step-tab").forEach((button) => {
        button.addEventListener("click", () => showStep(Number(button.dataset.stepTarget)));
      });
      prevButton.addEventListener("click", () => showStep(currentStep - 1));
      nextButton.addEventListener("click", () => showStep(currentStep + 1));
      createButton.addEventListener("click", () => location.href = "task-list.html");
      document.querySelectorAll(".multi-dropdown").forEach(bindMultiDropdown);
      updateInspectionType();
      updateGovernanceCards();
      addHitRule("liveReportCount", "大等于", ["25"]);
    </script>
  </body>
</html>
