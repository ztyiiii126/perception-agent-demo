<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>感知Agent</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #fbfcfd;
        --panel-soft: #edf2f4;
        --text: #26231f;
        --muted: #7b756a;
        --line: #dde4e8;
        --accent: #3b6ef6;
        --accent-soft: #e8efff;
        --green: #20a779;
        --shadow: 0 22px 60px rgba(62, 55, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 55% 0%, rgba(255, 255, 255, 0.94) 0 18%, transparent 42%),
          linear-gradient(135deg, #f3f6fa 0%, #fbfcfd 48%, #edf7f3 100%);
        color: var(--text);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 282px minmax(0, 1fr);
        min-height: 100vh;
        transition: grid-template-columns 180ms ease;
      }

      .app.sidebar-collapsed {
        grid-template-columns: 78px minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        gap: 22px;
        height: 100vh;
        padding: 22px 16px;
        border-right: 1px solid rgba(223, 216, 203, 0.78);
        background: rgba(244, 247, 249, 0.86);
        backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px 10px;
        font-size: 22px;
        font-weight: 840;
        line-height: 1.15;
      }

      .collapse-toggle {
        display: inline-grid;
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #8a8f94;
        cursor: pointer;
      }

      .collapse-toggle:hover {
        background: rgba(235, 238, 241, 0.9);
        color: #626a72;
      }

      .collapse-toggle svg {
        width: 21px;
        height: 21px;
        stroke-width: 2;
      }

      .new-task {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 14px;
        background: #171717;
        color: #fff;
        cursor: pointer;
        font-weight: 650;
        box-shadow: 0 12px 26px rgba(23, 23, 23, 0.16);
      }

      .task-dialog {
        width: min(960px, calc(100vw - 48px));
        padding: 0;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 20px;
        background: #fff;
        color: var(--text);
        box-shadow: 0 28px 80px rgba(32, 44, 62, 0.18);
      }

      .task-dialog::backdrop {
        background: rgba(32, 40, 52, 0.24);
        backdrop-filter: blur(8px);
      }

      .dialog-head,
      .dialog-body,
      .dialog-actions {
        padding: 18px 20px;
      }

      .dialog-head,
      .dialog-actions {
        border-bottom: 1px solid var(--line);
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--line);
        border-bottom: 0;
      }

      .dialog-title {
        font-size: 18px;
        font-weight: 800;
      }

      .dialog-body textarea {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        outline: 0;
        background: #fbfcfd;
        color: var(--text);
        line-height: 1.7;
      }

      .dialog-actions button {
        height: 36px;
        padding: 0 14px;
        border-radius: 11px;
        cursor: pointer;
        font-weight: 760;
      }

      .dialog-cancel {
        border: 1px solid var(--line);
        background: #fff;
        color: #59636e;
      }

      .dialog-submit {
        border: 1px solid rgba(59, 110, 246, 0.18);
        background: var(--accent);
        color: #fff;
      }

      .new-task span,
      .brand span,
      .primary-label,
      .nav-label,
      .task-copy,
      .section-title {
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .nav-stack,
      .task-stack {
        display: grid;
        gap: 8px;
      }

      .primary-menu {
        display: grid;
        gap: 8px;
      }

      .primary-menu-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #4c5563;
        cursor: pointer;
        font-weight: 760;
        font-size: 14px;
        text-align: left;
      }

      .primary-menu-button.active {
        background: rgba(255, 255, 255, 0.72);
        color: #20242a;
      }

      .primary-menu-button::after {
        display: none;
        content: attr(data-short);
      }

      .agent-nav {
        margin-left: 12px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }

      .nav-button,
      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }

      .nav-button {
        padding: 0 12px;
        font-weight: 650;
      }

      .nav-button.active {
        background: #fff;
        color: var(--text);
        box-shadow: 0 10px 24px rgba(80, 72, 56, 0.08);
      }

      .nav-icon,
      .task-dot {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
      }

      .nav-icon {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        background: var(--panel-soft);
        color: #504b44;
      }

      .nav-button.active .nav-icon {
        background: #e9f6f1;
        color: var(--green);
      }

      .tasks {
        display: flex;
        min-height: 0;
        margin-top: 14px;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }

      .section-title {
        display: block;
        padding: 0 10px;
        color: #9a9285;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .section-title:hover {
        color: #6f7a86;
      }

      .task-item {
        align-items: flex-start;
        padding: 10px 10px;
      }

      .task-dot {
        width: 24px;
        height: 24px;
        margin-top: 1px;
        border-radius: 50%;
        background: #fff;
        color: var(--accent);
        font-size: 13px;
      }

      .task-copy {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .task-name {
        color: #38342e;
        font-size: 14px;
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-meta {
        color: #a09a91;
        font-size: 12px;
      }

      .app.sidebar-collapsed .sidebar {
        gap: 16px;
        padding: 20px 12px;
      }

      .app.sidebar-collapsed .brand {
        justify-content: center;
        padding: 4px 0 8px;
      }

      .app.sidebar-collapsed .brand span,
      .app.sidebar-collapsed .new-task span,
      .app.sidebar-collapsed .primary-label,
      .app.sidebar-collapsed .nav-label,
      .app.sidebar-collapsed .task-copy,
      .app.sidebar-collapsed .section-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        transform: translateX(-6px);
        pointer-events: none;
      }

      .app.sidebar-collapsed .collapse-toggle svg {
        transform: none;
      }

      .app.sidebar-collapsed .new-task {
        width: 46px;
        padding: 0;
        border-radius: 14px;
      }

      .app.sidebar-collapsed .primary-menu-button,
      .app.sidebar-collapsed .nav-button,
      .app.sidebar-collapsed .task-item {
        justify-content: center;
        width: 46px;
        padding: 0;
      }

      .app.sidebar-collapsed .primary-menu-button::after {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 9px;
        background: var(--panel-soft);
        color: #504b44;
        font-size: 12px;
        font-weight: 820;
      }

      .app.sidebar-collapsed .primary-menu-button.active::after {
        background: #e9f6f1;
        color: var(--green);
      }

      .app.sidebar-collapsed .agent-nav {
        margin-left: 0;
        padding-left: 0;
        border-left: 0;
      }

      .app.sidebar-collapsed .tasks {
        align-items: center;
      }

      .app.sidebar-collapsed .task-stack {
        display: none;
      }

      main {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        padding: 38px 44px 34px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        width: min(100%, 980px);
        margin-bottom: 58px;
      }

      .manual-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 14px;
        border: 1px solid rgba(59, 110, 246, 0.16);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.78);
        color: #3553a8;
        text-decoration: none;
        font-size: 13px;
        font-weight: 760;
        box-shadow: 0 8px 22px rgba(59, 110, 246, 0.08);
      }

      .manual-link:hover {
        border-color: rgba(59, 110, 246, 0.34);
        background: #fff;
        color: #214fce;
      }

      .workspace {
        width: min(100%, 930px);
      }

      .hero-title {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(22px, 2.1vw, 28px);
        font-weight: 760;
        line-height: 1.15;
      }

      .chat-panel {
        overflow: hidden;
        border: 1px solid rgba(218, 226, 231, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow);
      }

      .prompt-area {
        display: flex;
        min-height: 282px;
        flex-direction: column;
        justify-content: space-between;
        padding: 26px 28px 18px;
      }

      .prompt-copy {
        max-width: 840px;
        color: #3f4650;
        font-size: 19px;
        font-weight: 400;
        line-height: 1.92;
        outline: 0;
        cursor: text;
      }

      .prompt-copy:focus {
        color: #303844;
      }

      .prompt-chip {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        margin: 0 5px;
        padding: 0 11px;
        border: 1px solid rgba(93, 131, 239, 0.16);
        border-radius: 9px;
        background: linear-gradient(180deg, #edf4ff 0%, #e5efff 100%);
        color: #2058df;
        font-size: 15px;
        font-weight: 650;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        vertical-align: baseline;
        white-space: normal;
      }

      .prompt-chip:focus {
        outline: 2px solid rgba(59, 110, 246, 0.24);
        outline-offset: 2px;
      }

      .prompt-chip .chip-label {
        margin-right: 7px;
        color: #6f8ee8;
        font-size: 12px;
        font-weight: 650;
      }

      .prompt-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 28px;
      }

      .prompt-tools {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .run-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #b3cbff;
        color: #fff;
        cursor: pointer;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .run-button:hover {
        background: var(--accent);
        transform: translateY(-1px);
      }

      .run-button svg {
        width: 22px;
        height: 22px;
      }

      .templates {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0;
        border: 0;
        background: transparent;
      }

      .template-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: #f5f7fa;
        color: #5d564d;
        cursor: pointer;
        font-size: 14px;
        font-weight: 680;
      }

      .template-tab.active {
        border-color: rgba(59, 110, 246, 0.22);
        background: var(--accent-soft);
        color: #214fce;
      }

      .frequent {
        margin-top: 30px;
      }

      .frequent-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 13px;
      }

      .frequent-title {
        font-size: 15px;
        font-weight: 760;
      }

      .frequent-note {
        color: var(--muted);
        font-size: 13px;
      }

      .quick-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .quick-card {
        position: relative;
        display: grid;
        min-height: 76px;
        place-items: center;
        padding: 14px 16px;
        border: 1px solid rgba(218, 226, 231, 0.9);
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(248, 251, 253, 0.72)),
          rgba(255, 255, 255, 0.62);
        color: #34302a;
        cursor: pointer;
        text-align: center;
        box-shadow: 0 10px 24px rgba(42, 52, 68, 0.06);
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .quick-card:hover {
        transform: translateY(-2px);
        border-color: rgba(59, 110, 246, 0.32);
        background: rgba(255, 255, 255, 0.9);
      }

      .quick-card.active {
        border-color: rgba(59, 110, 246, 0.5);
        background: #f4f8ff;
        box-shadow: inset 0 0 0 1px rgba(59, 110, 246, 0.12);
      }

      .template-tab:focus-visible,
      .quick-card:focus-visible,
      .new-task:focus-visible,
      .collapse-toggle:focus-visible,
      .nav-button:focus-visible,
      .manual-link:focus-visible,
      .run-button:focus-visible,
      .task-item:focus-visible {
        outline: 3px solid rgba(59, 110, 246, 0.24);
        outline-offset: 2px;
      }

      .quick-name {
        display: block;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.35;
      }

      .quick-desc {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .manual-link svg {
        width: 16px;
        height: 16px;
      }

      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }

        .app.sidebar-collapsed {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: sticky;
          top: 0;
          z-index: 5;
          display: grid;
          grid-template-columns: 1fr;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .app.sidebar-collapsed .sidebar {
          padding: 16px 12px;
        }

        .tasks {
          display: none;
        }

        main {
          padding: 28px 18px;
        }

        .topbar {
          margin-bottom: 44px;
        }

        .quick-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .sidebar {
          gap: 14px;
          padding: 16px 12px;
        }

        .brand {
          font-size: 16px;
        }

        .nav-stack {
          grid-template-columns: 1fr 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 34px;
        }

        .hero-title {
          text-align: left;
        }

        .prompt-area {
          padding: 20px 18px 0;
        }

        .prompt-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .prompt-copy {
          font-size: 16px;
          line-height: 1.85;
        }

        .prompt-chip {
          margin: 3px 0;
          font-size: 13px;
        }

        .quick-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="appShell">
      <aside class="sidebar" aria-label="左侧导航">
        <div class="brand">
          <span>感知Agent</span>
          <button class="collapse-toggle" id="sidebarToggle" type="button" aria-label="收起左侧菜单" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="3.5" /><path d="M10 4v16" /></svg>
          </button>
        </div>

        <button class="new-task" type="button" onclick="location.href='new-task.html'">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>新建任务</span>
        </button>

        <nav class="primary-menu" aria-label="功能导航">
          <button class="primary-menu-button active" data-short="A" type="button" onclick="location.href='agent-management.html'" title="Agent"><span class="primary-label">Agent</span></button>
          <div class="nav-stack agent-nav" aria-label="Agent功能">
            <button class="nav-button active" type="button" title="巡检捉虫">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 11 2 2 4-5" />
                  <path d="M20 12a8 8 0 1 1-3.1-6.3" />
                  <path d="M18 4h3v3" />
                </svg>
              </span>
              <span class="nav-label">巡检捉虫</span>
            </button>
            <button class="nav-button" type="button" onclick="location.href='opinion.html'" title="舆情分析">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12h4l3 8 4-16 3 8h4" />
                </svg>
              </span>
              <span class="nav-label">舆情分析</span>
            </button>
          </div>
          <button class="primary-menu-button" data-short="S" type="button" onclick="location.href='skill.html'" title="Skill"><span class="primary-label">Skill</span></button>
          <button class="primary-menu-button" data-short="T" type="button" onclick="location.href='tools.html'" title="工具集"><span class="primary-label">工具集</span></button>
          <button class="primary-menu-button" data-short="K" type="button" onclick="location.href='knowledge.html'" title="知识库"><span class="primary-label">知识库</span></button>
          <button class="primary-menu-button" data-short="M" type="button" onclick="location.href='effect-monitor.html'" title="效果监控"><span class="primary-label">效果监控</span></button>
        </nav>

        <section class="tasks" aria-label="任务列表">
          <a class="section-title" href="task-list.html">任务列表</a>
          <div class="task-stack">
            <button class="task-item" type="button">
              <span class="task-copy">
                <span class="task-name">榴莲虚假宣传直播间巡检</span>
              </span>
            </button>
            <button class="task-item" type="button">
              <span class="task-copy">
                <span class="task-name">AWLS社交平台舆情风险定级</span>
              </span>
            </button>
            <button class="task-item" type="button">
              <span class="task-copy">
                <span class="task-name">通用风险线索研判任务</span>
              </span>
            </button>
          </div>
        </section>
      </aside>

      <main>
        <div class="topbar">
          <a class="manual-link" href="#" aria-label="打开巡检捉虫使用手册">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z" /></svg>
            使用手册
          </a>
        </div>

        <section class="workspace" aria-labelledby="page-title">
          <h1 class="hero-title" id="page-title">巡检捉虫Agent</h1>

          <section class="chat-panel" aria-label="风险巡检对话框">
            <div class="prompt-area">
              <div class="prompt-copy" aria-live="polite" contenteditable="true" spellcheck="false">
                启动
                <span class="prompt-chip" id="category" contenteditable="true"><span class="chip-label" contenteditable="false">榜单名称</span>男装榜</span>
                <span id="templateTitle">榜单巡检</span>，当
                <span class="prompt-chip" id="ending" contenteditable="true"><span class="chip-label" contenteditable="false">结束条件</span>巡检Top 50直播间、每小时巡检Top 50直播间巡检24次</span>
                后，自动结束本次巡检。
              </div>

              <div class="prompt-toolbar">
                <div class="prompt-tools">
                  <div class="templates" aria-label="默认模板">
                    <button class="template-tab active" data-template="rank" type="button">榜单巡检</button>
                    <button class="template-tab" data-template="live" type="button">直播间巡检</button>
                  </div>
                </div>
                <button class="run-button" type="button" aria-label="开始巡检" onclick="location.href='task.html'">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
                </button>
              </div>
            </div>
          </section>

          <section class="frequent" aria-labelledby="frequent-title">
            <div class="frequent-head">
              <div class="frequent-title" id="frequent-title">高频使用</div>
            </div>
            <div class="quick-grid">
              <button class="quick-card" data-preset="durianScheduled" type="button">
                <span class="quick-name">榴莲虚假宣传专项定时任务</span>
              </button>
              <button class="quick-card" data-preset="durianSingle" type="button">
                <span class="quick-name">榴莲虚假宣传专项单次任务</span>
              </button>
              <button class="quick-card" data-preset="freshScheduled" type="button">
                <span class="quick-name">生鲜榜定时任务</span>
              </button>
              <button class="quick-card" data-preset="freshSingle" type="button">
                <span class="quick-name">生鲜榜单次任务</span>
              </button>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog class="task-dialog" id="newTaskDialog">
      <form method="dialog">
        <div class="dialog-head">
          <div class="dialog-title">新建任务</div>
        </div>
        <div class="dialog-body">
          <textarea placeholder="直接描述你想完成的任务。平台会理解任务意图，并选择合适的 Agent、Skill、工具和知识库执行。"></textarea>
        </div>
        <div class="dialog-actions">
          <button class="dialog-cancel" value="cancel" type="submit">取消</button>
          <button class="dialog-submit" value="submit" type="submit">提交任务</button>
        </div>
      </form>
    </dialog>

    <script>
      const templates = {
        rank: {
          title: "榜单巡检",
          category: '<span class="chip-label" contenteditable="false">榜单名称</span>男装榜',
          ending: '<span class="chip-label" contenteditable="false">结束条件</span>巡检Top 50直播间、每小时巡检Top 50直播间巡检24次',
        },
        live: {
          title: "直播间巡检",
          category: '<span class="chip-label" contenteditable="false">专项名称</span>榴莲虚假宣传',
          ending: '<span class="chip-label" contenteditable="false">结束条件</span>巡检20个直播间、每小时巡检20个直播间巡检24次',
        },
      };

      const presets = {
        durianScheduled: {
          title: "直播间巡检",
          category: '<span class="chip-label" contenteditable="false">专项名称</span>榴莲虚假宣传',
          ending: '<span class="chip-label" contenteditable="false">结束条件</span>巡检20个直播间、每小时巡检20个直播间巡检24次',
        },
        durianSingle: {
          title: "直播间巡检",
          category: '<span class="chip-label" contenteditable="false">专项名称</span>榴莲虚假宣传',
          ending: '<span class="chip-label" contenteditable="false">结束条件</span>巡检20个直播间',
        },
        freshScheduled: {
          title: "榜单巡检",
          category: '<span class="chip-label" contenteditable="false">榜单名称</span>生鲜榜',
          ending: '<span class="chip-label" contenteditable="false">结束条件</span>每小时巡检Top 50直播间巡检24次',
        },
        freshSingle: {
          title: "榜单巡检",
          category: '<span class="chip-label" contenteditable="false">榜单名称</span>生鲜榜',
          ending: '<span class="chip-label" contenteditable="false">结束条件</span>巡检Top 50直播间',
        },
      };

      const title = document.querySelector("#templateTitle");
      const category = document.querySelector("#category");
      const ending = document.querySelector("#ending");
      const tabs = document.querySelectorAll(".template-tab");

      function renderContent(content) {
        title.textContent = content.title;
        category.innerHTML = content.category;
        ending.innerHTML = content.ending;
        category.setAttribute("contenteditable", "true");
        ending.setAttribute("contenteditable", "true");
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((item) => item.classList.remove("active"));
          quickCards.forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");
          renderContent(templates[tab.dataset.template]);
        });
      });

      const quickCards = document.querySelectorAll(".quick-card");

      quickCards.forEach((card) => {
        card.addEventListener("click", () => {
          tabs.forEach((item) => item.classList.remove("active"));
          quickCards.forEach((item) => item.classList.remove("active"));
          card.classList.add("active");
          renderContent(presets[card.dataset.preset]);
        });
      });

      const appShell = document.querySelector("#appShell");
      const sidebarToggle = document.querySelector("#sidebarToggle");
      const newTaskDialog = document.querySelector("#newTaskDialog");

      document.querySelectorAll(".open-task-dialog").forEach((button) => {
        button.addEventListener("click", () => newTaskDialog.showModal());
      });

      sidebarToggle.addEventListener("click", () => {
        const collapsed = appShell.classList.toggle("sidebar-collapsed");
        sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
        sidebarToggle.setAttribute("aria-label", collapsed ? "展开左侧菜单" : "收起左侧菜单");
      });
    </script>
  </body>
</html>
